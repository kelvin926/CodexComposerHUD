name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build Ubuntu packages
        run: python3 scripts/build_linux.py
      - name: Test with bundled runtime and verify package
        run: |
          build/runtime-x64/node --test tests/*.test.mjs
          sudo dpkg --install dist/*_amd64.deb
          /opt/codex-composer-hud/runtime/node --version
          codex-composer-hud --diagnose
          sudo dpkg --remove codex-composer-hud
          dpkg-deb --info dist/*_arm64.deb
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ubuntu-packages
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build Windows installer
        run: python scripts/build_windows.py
      - name: Test with bundled runtime
        run: '& "build/windows-stage/CodexComposerHUD/runtime/node.exe" --test tests/metrics.test.mjs tests/quota.test.mjs tests/sessions.test.mjs tests/chat-quota.test.mjs tests/macos-platform.test.mjs tests/companion.test.mjs tests/posix-auto.test.mjs tests/composer-mount.test.mjs'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-packages
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build Apple Silicon app and installer
        run: |
          test "$(uname -m)" = arm64
          python3 scripts/build_macos.py
      - name: Verify macOS ARM64 bundle and logic
        run: |
          program=build/macos-stage/CodexComposerHUD.app/Contents/Resources/hud
          "$program/runtime/node" --version
          "$program/runtime/node" --test tests/metrics.test.mjs tests/quota.test.mjs tests/sessions.test.mjs tests/chat-quota.test.mjs tests/macos-platform.test.mjs tests/companion.test.mjs tests/posix-auto.test.mjs tests/composer-mount.test.mjs
          "$program/runtime/node" "$program/launcher-macos.mjs" --diagnose
          build/macos-stage/CodexComposerHUD.app/Contents/MacOS/CodexComposerHUD --check-bundle
          codesign --verify --deep --strict build/macos-stage/CodexComposerHUD.app
          pkgutil --payload-files dist/CodexComposerHUD-macOS-arm64.pkg
          sh -n packaging/macos/scripts/postinstall
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-arm64-packages
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true
      - name: Sign build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
      - name: Save verification bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/CodexComposerHUD-build-attestation.json
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; keeping its assets."
            exit 0
          fi
          cd dist
          sha256sum --check *.sha256
          cd ..
          gh release create "$tag" dist/* --target "$GITHUB_SHA" \
            --title "Codex Composer HUD $tag" --notes-file RELEASE_NOTES.md
